# -----------------------------------------------------------------------------
# Production add-on: put Caddy (automatic HTTPS) in front of the API.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# Requires in .env: DOMAIN=api.yourdomain.com (DNS A record -> this server's IP)
# Only ports 80 and 443 are opened to the internet; the API itself is no longer
# published on the host.
# -----------------------------------------------------------------------------
services:
  api:
    ports: !reset []
    environment:
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates: keep this volume!
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [backend]

volumes:
  caddy_data:
  caddy_config:
