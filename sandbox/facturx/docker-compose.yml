# Usage (from sandbox/facturx):
#   docker compose build
#   docker compose run --rm generator samples/fr-consulting.json samples/de-mixed-vat.json --out out
#   bash scripts/validate-all.sh
services:
  generator:
    build: .
    image: invoiceformat/facturx-sandbox:0.1.0
    working_dir: /work
    volumes:
      - ./samples:/work/samples:ro   # input JSON (read-only)
      - ./out:/work/out              # generated PDFs/XML appear here on your computer
    network_mode: none               # generator never needs the internet
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
